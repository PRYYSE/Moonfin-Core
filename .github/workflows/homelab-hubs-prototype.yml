name: Home Lab Web UI

on:
  workflow_dispatch:
  push:
    branches:
      - homelab/hubs-v1
    paths:
      - '.github/workflows/homelab-hubs-prototype.yml'
      - 'tooling/apply_homelab_hubs_patch.py'
      - 'tooling/apply_homelab_home_redesign_patch.py'
      - 'tooling/apply_homelab_home_visual_polish_patch.py'
      - 'tooling/deploy_homelab_web.sh'
      - 'lib/ui/navigation/homelab_hub_routes.dart'
      - 'lib/ui/screens/home/**'
      - 'lib/ui/screens/hubs/**'

permissions:
  contents: write

concurrency:
  group: homelab-web-ui
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  patch-build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Home Lab branch
        uses: actions/checkout@v4
        with:
          ref: homelab/hubs-v1
          fetch-depth: 0

      - name: Validate Home Lab helpers
        run: |
          python3 -m py_compile \
            tooling/apply_homelab_hubs_patch.py \
            tooling/apply_homelab_home_redesign_patch.py \
            tooling/apply_homelab_home_visual_polish_patch.py
          bash -n tooling/deploy_homelab_web.sh

      - name: Apply isolated router and navigation patch
        run: python3 tooling/apply_homelab_hubs_patch.py

      - name: Apply comprehensive web Home redesign
        run: |
          if grep -q 'HomelabHomeComposer.augmentConfigs' lib/ui/screens/home/home_view_model.dart; then
            echo 'Comprehensive Home structural wiring already present.'
          else
            # An earlier design spike was formatted and partially committed
            # before the comprehensive composer wiring existed. Convert only
            # that known intermediate shelf state back to the stock anchors the
            # comprehensive patch expects. This path disappears after the first
            # successful generated-wiring commit.
            python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/ui/screens/home/home_screen.dart')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'premiumWeb ? 14 : (isRowsV2 ? 6 : 16)',
              'isRowsV2 ? 6 : 16',
          ).replace(
              'premiumWeb ? 7 : (isRowsV2 ? 1 : 8)',
              'isRowsV2 ? 1 : 8',
          )

          marker = 'letterSpacing: premiumWeb ? -0.25 : null,'
          if marker in text:
              lines = text.splitlines(keepends=True)
              marker_index = next(
                  i for i, line in enumerate(lines) if marker in line
              )
              style_index = next(
                  i
                  for i in range(marker_index, -1, -1)
                  if lines[i].lstrip().startswith('style:')
              )
              style_end = next(
                  i
                  for i in range(marker_index, len(lines))
                  if lines[i].strip() == '),'
              )
              stock_style = [
                  '                        style: Theme.of(context).textTheme.titleMedium?.copyWith(\n',
                  '                          color: AppColorScheme.onSurface,\n',
                  '                          fontWeight: FontWeight.w600,\n',
                  '                        ),\n',
              ]
              lines[style_index : style_end + 1] = stock_style
              text = ''.join(lines)

          path.write_text(text, encoding='utf-8')
          PY
            python3 tooling/apply_homelab_home_redesign_patch.py
          fi

      - name: Apply comprehensive web Home visual polish
        run: python3 tooling/apply_homelab_home_visual_polish_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Format touched Dart files
        run: |
          dart format \
            lib/ui/navigation/app_router.dart \
            lib/ui/navigation/homelab_hub_routes.dart \
            lib/ui/screens/home/home_screen.dart \
            lib/ui/screens/home/home_view_model.dart \
            lib/ui/screens/home/homelab_home_composer.dart \
            lib/ui/screens/hubs/homelab_hub_screen.dart \
            lib/ui/widgets/left_sidebar.dart \
            lib/ui/widgets/top_toolbar.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web redesign bundle
        run: flutter build web --wasm --release --base-href "/Moonfin/Web/"

      - name: Write plugin runtime config
        run: |
          cat > build/web/config.json <<'EOF'
          {
            "schemaVersion": 1,
            "defaultServerUrl": null,
            "discoveryProxyUrl": null,
            "enableWebRtcScan": true,
            "brandingName": "Moonfin Home Lab",
            "pluginMode": true,
            "forcedServerUrl": null
          }
          EOF

      - name: Package Home redesign
        run: |
          printf '%s\n' \
            '{' \
            '  "schemaVersion": 1,' \
            '  "prototype": "homelab-hubs-v1",' \
            '  "design": "home-web-comprehensive-v1",' \
            '  "commit": "${{ github.sha }}",' \
            '  "flutterVersion": "${{ env.FLUTTER_VERSION }}"' \
            '}' > build/web/homelab-build-manifest.json
          tar -czf homelab-moonfin-web.tar.gz -C build/web .
          sha256sum homelab-moonfin-web.tar.gz > homelab-moonfin-web.tar.gz.sha256

      - name: Commit generated wiring after successful build
        run: |
          if git diff --quiet; then
            echo "No generated patch changes to commit."
          else
            git config user.name "Home Lab Build Bot"
            git config user.email "actions@users.noreply.github.com"
            git add \
              lib/ui/navigation/app_router.dart \
              lib/ui/navigation/homelab_hub_routes.dart \
              lib/ui/screens/home/home_screen.dart \
              lib/ui/screens/home/home_view_model.dart \
              lib/ui/screens/home/homelab_home_composer.dart \
              lib/ui/screens/hubs/homelab_hub_screen.dart \
              lib/ui/widgets/left_sidebar.dart \
              lib/ui/widgets/top_toolbar.dart
            if git diff --cached --quiet; then
              echo "No staged generated changes to commit."
            else
              git commit -m "Generate comprehensive Home Lab web redesign [skip ci]"
              for attempt in 1 2 3; do
                git fetch origin homelab/hubs-v1
                if git rebase origin/homelab/hubs-v1; then
                  if git push origin HEAD:homelab/hubs-v1; then
                    exit 0
                  fi
                else
                  git rebase --abort || true
                fi
                echo "Generated wiring push raced with another branch update; retrying ($attempt/3)."
                sleep 2
              done
              echo "Could not safely publish generated wiring after 3 attempts."
              exit 1
            fi
          fi

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-moonfin-web
          path: |
            homelab-moonfin-web.tar.gz
            homelab-moonfin-web.tar.gz.sha256
            build/web/homelab-build-manifest.json
          if-no-files-found: error

      - name: Publish stable Home redesign download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="homelab-hubs-v1-latest"
          TITLE="Home Lab Moonfin Web UI"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              homelab-moonfin-web.tar.gz \
              homelab-moonfin-web.tar.gz.sha256 \
              build/web/homelab-build-manifest.json \
              --clobber
          else
            gh release create "$TAG" \
              homelab-moonfin-web.tar.gz \
              homelab-moonfin-web.tar.gz.sha256 \
              build/web/homelab-build-manifest.json \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "Web-first Home Lab UI redesign. Keep the Home Lab fork unmerged until the UX milestone is approved." \
              --prerelease
          fi