name: Home Lab Seerr Discovery Web Candidate

on:
  push:
    branches:
      - homelab/seerr-discovery-v1-staging
    paths:
      - .github/workflows/homelab-seerr-discovery-web-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'
  SOURCE_SHA: '0079647902b54b78d71b048a4a7572c51cba49f2'
  SOURCE_BRANCH: 'homelab/seerr-discovery-v1-staging'
  RELEASE_TAG: 'homelab-seerr-discovery-web-candidate-0079647902b5'
  ASSET_NAME: 'Moonfin_HomeLab_Seerr_Discovery_Web_0079647902b5.tar.gz'

jobs:
  build-web-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact validated Discovery source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$SOURCE_SHA" ]] || {
            echo "Expected $SOURCE_SHA but checked out $actual" >&2
            exit 1
          }
          echo "candidate_source_sha=$actual"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies and build Web candidate
        run: |
          set -Eeuo pipefail
          flutter pub get
          flutter build web --wasm --release --base-href "/Moonfin/Web/"

      - name: Write current runtime config and manifests
        run: |
          set -Eeuo pipefail
          RAW_VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '[:space:]')"
          SEMVER="$(printf '%s' "$RAW_VERSION" | cut -d'+' -f1)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            '{
              schemaVersion: 1,
              defaultServerUrl: null,
              discoveryProxyUrl: null,
              enableWebRtcScan: true,
              brandingName: "Moonfin",
              pluginMode: true,
              forcedServerUrl: null
            }' > build/web/config.json

          jq -n \
            --arg version "$SEMVER" \
            --arg commit "$SOURCE_SHA" \
            --arg ref "$SOURCE_BRANCH" \
            --arg flutterVersion "$FLUTTER_VERSION" \
            --arg buildTime "$BUILD_TIME" \
            '{
              schemaVersion: 1,
              version: $version,
              commit: $commit,
              ref: $ref,
              flutterVersion: $flutterVersion,
              baseHref: "/Moonfin/Web/",
              buildTime: $buildTime
            }' > build/web/build-manifest.json

          jq -n \
            --arg sourceBranch "$SOURCE_BRANCH" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg flutterVersion "$FLUTTER_VERSION" \
            --arg builtAtUtc "$BUILD_TIME" \
            '{
              schemaVersion: 1,
              prototype: "homelab-seerr-discovery-v1",
              design: "seerr-discovery-v1-candidate",
              sourceBranch: $sourceBranch,
              sourceCommit: $sourceCommit,
              sourceOwned: true,
              builder: "github-actions",
              flutterVersion: $flutterVersion,
              theme: "home_lab_streaming",
              discoverySchemaVersion: 2,
              authoringLaneCount: 486,
              builtAtUtc: $builtAtUtc
            }' > build/web/homelab-build-manifest.json

      - name: Verify candidate bundle contract
        run: |
          set -Eeuo pipefail
          test -s build/web/index.html
          test -s build/web/config.json
          test -s build/web/build-manifest.json
          test -s build/web/homelab-build-manifest.json
          test -f build/web/main.dart.wasm || test -f build/web/main.dart.js

          jq -e \
            --arg source "$SOURCE_SHA" \
            '.sourceCommit == $source and
             .design == "seerr-discovery-v1-candidate" and
             .theme == "home_lab_streaming" and
             .discoverySchemaVersion == 2 and
             .authoringLaneCount == 486' \
            build/web/homelab-build-manifest.json >/dev/null

          jq -e \
            '.schemaVersion == 1 and
             .pluginMode == true and
             .enableWebRtcScan == true and
             .defaultServerUrl == null and
             .discoveryProxyUrl == null and
             .forcedServerUrl == null' \
            build/web/config.json >/dev/null

      - name: Package exact candidate
        run: |
          set -Eeuo pipefail
          tar -czf "$ASSET_NAME" -C build/web .
          sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
          sha256sum -c "$ASSET_NAME.sha256"
          echo "candidate_asset=$ASSET_NAME"
          cat "$ASSET_NAME.sha256"

      - name: Upload immutable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-seerr-discovery-web-0079647902b5
          path: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256
            build/web/build-manifest.json
            build/web/homelab-build-manifest.json
            build/web/config.json
          if-no-files-found: error

      - name: Publish exact public prerelease candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists; refusing to replace immutable candidate." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Home Lab Seerr Discovery Web Candidate 0079647902b5" \
            --notes "Exact Web candidate built from validated Discovery source $SOURCE_SHA. Not promoted to live. Includes schema-v2 Discovery UI, 486-lane authoring model support, personalised/configured-list See All, rotation persistence, rich browse filters and full catalogue index." \
            "$ASSET_NAME" \
            "$ASSET_NAME.sha256" \
            "build/web/build-manifest.json#build-manifest.json" \
            "build/web/homelab-build-manifest.json#homelab-build-manifest.json" \
            "build/web/config.json#config.json"

      - name: Verify published prerelease metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,tagName,targetCommitish,assets)"
          printf '%s' "$release_json" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg asset "$ASSET_NAME" \
            '.isPrerelease == true and
             .tagName == $tag and
             ([.assets[].name] | index($asset) != null) and
             ([.assets[].name] | index($asset + ".sha256") != null) and
             ([.assets[].name] | index("homelab-build-manifest.json") != null)' >/dev/null
          echo "published_release_tag=$RELEASE_TAG"
