name: Home Lab Android CI

on:
  push:
    branches:
      - homelab/hubs-v1
    paths:
      - '.github/workflows/homelab-android-beta.yml'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

concurrency:
  group: homelab-android-beta
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  android-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Home Lab branch
        uses: actions/checkout@v4
        with:
          ref: homelab/hubs-v1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android phone/tablet CI APK
        run: |
          flutter build apk --release \
            --flavor mobile-beta \
            --dart-define=DISTRIBUTION_CHANNEL=apk

          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*mobile-beta*release.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Home Lab beta APK was not produced." >&2
            find build/app/outputs/flutter-apk -maxdepth 1 -type f -print || true
            exit 1
          fi

          cp "$APK" Moonfin_HomeLab_Android.apk
          sha256sum Moonfin_HomeLab_Android.apk > Moonfin_HomeLab_Android.apk.sha256

      - name: Record CI checksum
        run: |
          sha256sum Moonfin_HomeLab_Android.apk
          echo "CI only: release APKs are built with the durable ServerBox signing identity."
