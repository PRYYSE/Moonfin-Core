name: Home Lab Discovery v2

on:
  push:
    branches:
      - homelab/discovery-v2
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-discovery-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Route integration gate
        run: python3 tooling/homelab-discovery-v2/apply_route_overlay.py --check

      - name: Authoring catalogue gate
        run: |
          python3 tooling/homelab-discovery-v2/generate_home_lab_discovery_catalogue.py --check
          python3 tooling/homelab-discovery-v2/test_home_lab_discovery_catalogue.py

      - name: Format gate
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/homelab_discovery \
            test/homelab_discovery
          git diff --exit-code -- \
            lib/features/homelab_discovery \
            test/homelab_discovery

      - name: Analyse overlay
        run: |
          flutter analyze \
            lib/features/homelab_discovery \
            lib/ui/navigation/app_router.dart \
            test/homelab_discovery

      - name: Focused tests
        run: flutter test test/homelab_discovery

      - name: Web interaction tests
        run: |
          flutter test --platform chrome \
            test/homelab_discovery/homelab_discovery_web_test.dart \
            test/homelab_discovery/homelab_discovery_entry_screen_test.dart

      - name: Verify custom scope stays narrow
        shell: bash
        run: |
          set -euo pipefail
          base='f18c45b1fbf9b63871b4f93237179f9706154763'
          git cat-file -e "$base^{commit}"
          mapfile -t changed < <(git diff --name-only "$base"...HEAD)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              lib/features/homelab_discovery/*|test/homelab_discovery/*|docs/AI_PROJECT_STATE.md|docs/UPSTREAM_UPDATE_PROTOCOL.md|docs/homelab-discovery-v2/*|.github/workflows/homelab-discovery-v2.yml|tooling/homelab-discovery-v2/*|lib/ui/navigation/app_router.dart)
                ;;
              *)
                echo "Unexpected v2 scope change: $path" >&2
                exit 1
                ;;
            esac
          done

  build-candidate-artifacts:
    name: build Web + mobile-beta + androidTv-beta
    needs: focused-validation
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build Web candidate
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release
          test -f build/web/index.html

      - name: Build Android mobile beta candidate
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --flavor mobile-beta \
            --dart-define=DISTRIBUTION_CHANNEL=apk
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -iname '*mobile-beta*release.apk' -print -quit)"
          test -n "$apk"
          test -f "$apk"
          printf '%s\n' "$apk" > /tmp/mobile-apk-path

      - name: Build Android TV beta candidate
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --flavor androidTv-beta \
            --dart-define=MOONFIN_FORCE_TV=true \
            --dart-define=DISTRIBUTION_CHANNEL=android_tv_apk
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -iname '*androidtv-beta*release.apk' -print -quit)"
          test -n "$apk"
          test -f "$apk"
          printf '%s\n' "$apk" > /tmp/tv-apk-path

      - name: Verify Android candidate identity and signing
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          aapt_bin="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n1)"
          apksigner_bin="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n1)"
          test -x "$aapt_bin"
          test -x "$apksigner_bin"

          mobile_apk="$(cat /tmp/mobile-apk-path)"
          tv_apk="$(cat /tmp/tv-apk-path)"
          mobile_badging="$($aapt_bin dump badging "$mobile_apk")"
          tv_badging="$($aapt_bin dump badging "$tv_apk")"

          expected_beta_id='org.moonfin.androidtv.beta'
          grep -q "^package: name='$expected_beta_id'" <<<"$mobile_badging"
          grep -q "^package: name='$expected_beta_id'" <<<"$tv_badging"

          if grep -q '^leanback-launcher:' <<<"$mobile_badging"; then
            echo 'Mobile beta unexpectedly exposes a Leanback launcher.' >&2
            exit 1
          fi
          grep -q '^leanback-launcher:' <<<"$tv_badging"

          cert_digest() {
            "$apksigner_bin" verify --print-certs "$1" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n1 \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          }

          mobile_cert="$(cert_digest "$mobile_apk")"
          tv_cert="$(cert_digest "$tv_apk")"
          production_cert='3163e01792e429ce972097a8e3ff9a4626488083142f8c2fdc102a4c75db2604'
          test -n "$mobile_cert"
          test "$mobile_cert" = "$tv_cert"
          test "$mobile_cert" != "$production_cert"
          printf '%s\n' "$mobile_cert" > /tmp/android-ci-cert-sha256
          printf 'Verified beta application ID: %s\n' "$expected_beta_id"
          printf 'Verified CI signing certificate SHA-256: %s\n' "$mobile_cert"
          printf 'Verified Android TV Leanback launcher and mobile non-Leanback split.\n'

      - name: Package candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          mkdir -p artifacts
          tar -C build/web -czf "artifacts/Moonfin_HomeLab_Web_${short_sha}.tar.gz" .
          cp "$(cat /tmp/mobile-apk-path)" "artifacts/Moonfin_HomeLab_Android_${short_sha}.apk"
          cp "$(cat /tmp/tv-apk-path)" "artifacts/Moonfin_HomeLab_AndroidTV_${short_sha}.apk"
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          tv_version="$(awk '/android_tv_version:/{print $2; exit}' pubspec.yaml)"
          tv_build="$(awk '/android_tv_build_number:/{print $2; exit}' pubspec.yaml)"
          ci_cert="$(cat /tmp/android-ci-cert-sha256)"
          cat > artifacts/BUILD_INFO.txt <<EOF
          source_sha=${GITHUB_SHA}
          flutter=${FLUTTER_VERSION}
          app_version=${version}
          android_tv_version=${tv_version}
          android_tv_build_number=${tv_build}
          web=release
          mobile_flavor=mobile-beta
          android_tv_flavor=androidTv-beta
          android_beta_application_id=org.moonfin.androidtv.beta
          android_tv_leanback_verified=true
          android_ci_signing=debug-fallback-not-for-deployment
          android_ci_certificate_sha256=${ci_cert}
          production_android_signing=preserve-existing-homelab-certificate
          production_android_certificate_sha256=3163e01792e429ce972097a8e3ff9a4626488083142f8c2fdc102a4c75db2604
          EOF
          (cd artifacts && sha256sum Moonfin_HomeLab_* > SHA256SUMS.txt)
          cat artifacts/BUILD_INFO.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: homelab-discovery-v2-candidates-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
