name: Home Lab Seerr Discovery Validation

on:
  push:
    branches:
      - homelab/seerr-discovery-v1-staging
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'
  MOONBASE_VERSION: '2.0.3.1'

jobs:
  discovery-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate generated Home Lab catalogue
        run: |
          python tooling/discovery/test_home_lab_discovery_catalogue.py
          python tooling/discovery/generate_home_lab_discovery_catalogue.py --check

      - name: Validate Discovery tooling syntax
        run: |
          python -m py_compile \
            tooling/discovery/home_lab_discovery_compile_live.py \
            tooling/discovery/home_lab_discovery_verify_live.py \
            tooling/discovery/apply_discovery_network_patch.py \
            tooling/discovery/apply_deep_discovery_ui_patch.py \
            tooling/discovery/cleanup_deep_discovery_legacy_ui.py \
            tooling/discovery/apply_configured_lists_patch_v2.py \
            tooling/discovery/apply_rich_browse_filters_patch_v2.py \
            tooling/discovery/apply_refinement_semantics_fix.py \
            tooling/discovery/apply_external_list_expansion_patch.py \
            tooling/discovery/apply_personalised_expanded_browse_patch.py
          bash -n tooling/discovery/home_lab_discovery_server_job.sh
          bash -n tooling/discovery/run_home_lab_discovery_server_job.sh

      - name: Apply personalised expanded browse in checkout
        run: python tooling/discovery/apply_personalised_expanded_browse_patch.py

      - name: Confirm existing committed Discovery integrations are present
        run: |
          python tooling/discovery/apply_discovery_network_patch.py --check
          python tooling/discovery/apply_deep_discovery_ui_patch.py --check
          python tooling/discovery/cleanup_deep_discovery_legacy_ui.py --check
          python tooling/discovery/apply_configured_lists_patch_v2.py --check
          python tooling/discovery/apply_rich_browse_filters_patch_v2.py --check
          python tooling/discovery/apply_refinement_semantics_fix.py --check
          python tooling/discovery/apply_external_list_expansion_patch.py --check
          python tooling/discovery/apply_personalised_expanded_browse_patch.py --check

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format exact promotion source
        run: |
          dart format \
            lib/data/services/seerr/seerr_discovery_*.dart \
            lib/data/viewmodels/seerr_discovery_collection_controller.dart \
            lib/data/viewmodels/seerr_deep_discovery_view_model.dart \
            lib/data/viewmodels/seerr_browse_view_model.dart \
            lib/data/services/seerr/seerr_http_client.dart \
            lib/data/repositories/seerr_repository.dart \
            lib/di/modules/app_module.dart \
            lib/ui/screens/seerr/seerr_discover_screen.dart \
            lib/ui/screens/seerr/seerr_browse_screen.dart \
            lib/ui/screens/seerr/seerr_discovery_refinement_dialog.dart \
            lib/ui/navigation/app_router.dart \
            test/data/seerr_discovery_*.dart \
            test/data/seerr_deep_discovery_view_model_test.dart

      - name: Analyse deep Discovery integration
        run: |
          flutter analyze \
            lib/data/services/seerr/seerr_discovery_catalogue_service.dart \
            lib/data/services/seerr/seerr_discovery_configured_lists_service.dart \
            lib/data/services/seerr/seerr_discovery_personalisation_service.dart \
            lib/data/services/seerr/seerr_discovery_browse_refinements.dart \
            lib/data/services/seerr/seerr_discovery_route_codec.dart \
            lib/data/viewmodels/seerr_deep_discovery_view_model.dart \
            lib/data/viewmodels/seerr_browse_view_model.dart \
            lib/di/modules/app_module.dart \
            lib/ui/screens/seerr/seerr_discover_screen.dart \
            lib/ui/screens/seerr/seerr_browse_screen.dart \
            lib/ui/screens/seerr/seerr_discovery_refinement_dialog.dart \
            lib/ui/navigation/app_router.dart

      - name: Run focused Discovery tests
        run: |
          flutter test \
            test/data/seerr_discovery_*.dart \
            test/data/seerr_deep_discovery_view_model_test.dart

      - name: Commit exact validated personalised expansion
        if: success()
        run: |
          if git diff --quiet -- \
            lib/data/viewmodels/seerr_browse_view_model.dart \
            lib/data/viewmodels/seerr_deep_discovery_view_model.dart \
            lib/ui/screens/seerr/seerr_browse_screen.dart \
            lib/ui/screens/seerr/seerr_discover_screen.dart \
            lib/ui/navigation/app_router.dart \
            lib/data/services/seerr/seerr_discovery_route_codec.dart \
            test/data/seerr_discovery_route_codec_test.dart; then
            echo "Personalised expanded browse is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/data/viewmodels/seerr_browse_view_model.dart \
            lib/data/viewmodels/seerr_deep_discovery_view_model.dart \
            lib/ui/screens/seerr/seerr_browse_screen.dart \
            lib/ui/screens/seerr/seerr_discover_screen.dart \
            lib/ui/navigation/app_router.dart \
            lib/data/services/seerr/seerr_discovery_route_codec.dart \
            test/data/seerr_discovery_route_codec_test.dart
          git commit -m "feat(discovery): expand personalised lanes through same cached row [skip ci]"
          git push origin HEAD:homelab/seerr-discovery-v1-staging

  moonbase-candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare exact Moonbase 2.0.3 source
        run: |
          git clone --quiet --depth 1 --branch 2.0.3 \
            https://github.com/Moonfin-Client/Plugin.git \
            "$RUNNER_TEMP/moonbase"
          cp tooling/discovery/moonbase/MoonfinDiscoveryController.cs \
            "$RUNNER_TEMP/moonbase/Jellyfin/backend/Api/MoonfinDiscoveryController.cs"

      - name: Build and verify Moonbase DLL only
        run: |
          ROOT="$RUNNER_TEMP/moonbase/Jellyfin"
          PUBLISH="$RUNNER_TEMP/moonbase-publish"
          dotnet publish "$ROOT/backend/Moonfin.Server.csproj" \
            -c Release \
            -o "$PUBLISH" \
            -p:AssemblyVersion="$MOONBASE_VERSION" \
            -p:FileVersion="$MOONBASE_VERSION" \
            -p:Version="$MOONBASE_VERSION"
          dotnet run --project "$ROOT/tools/verify-plugin/VerifyPlugin.csproj" \
            -c Release -- "$PUBLISH/Moonfin.Server.dll" "$MOONBASE_VERSION"
          sha256sum "$PUBLISH/Moonfin.Server.dll" \
            | tee "$PUBLISH/Moonfin.Server.dll.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: moonbase-discovery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/moonbase-publish/Moonfin.Server.dll
            ${{ runner.temp }}/moonbase-publish/Moonfin.Server.dll.sha256
          if-no-files-found: error
