name: Home Lab Seerr Discovery Web Publish

on:
  push:
    branches:
      - homelab/seerr-discovery-v1-staging
    paths:
      - .github/workflows/homelab-seerr-discovery-web-publish.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  SOURCE_SHA: '0079647902b54b78d71b048a4a7572c51cba49f2'
  SOURCE_RUN_ID: '31790516737'
  RELEASE_TAG: 'homelab-seerr-discovery-web-candidate-0079647902b5'
  ASSET_NAME: 'Moonfin_HomeLab_Seerr_Discovery_Web_0079647902b5.tar.gz'

jobs:
  publish-exact-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact validated Actions artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: homelab-seerr-discovery-web-0079647902b5
          path: candidate

      - name: Verify exact downloaded candidate before publication
        run: |
          set -Eeuo pipefail
          cd candidate
          test -s "$ASSET_NAME"
          test -s "$ASSET_NAME.sha256"
          sha256sum -c "$ASSET_NAME.sha256"

          MANIFEST="build/web/homelab-build-manifest.json"
          CONFIG="build/web/config.json"
          test -s "$MANIFEST"
          test -s "$CONFIG"
          jq -e \
            --arg source "$SOURCE_SHA" \
            '.sourceCommit == $source and
             .design == "seerr-discovery-v1-candidate" and
             .theme == "home_lab_streaming" and
             .discoverySchemaVersion == 2 and
             .authoringLaneCount == 486' \
            "$MANIFEST" >/dev/null

      - name: Refuse to replace an existing immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing replacement." >&2
            exit 1
          fi

      - name: Create public prerelease from exact artifact
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_SHA }}
          name: Home Lab Seerr Discovery Web Candidate 0079647902b5
          prerelease: true
          body: |
            Exact Home Lab Web candidate built from validated Discovery source `0079647902b54b78d71b048a4a7572c51cba49f2`.

            Not promoted to live. Includes schema-v2 Discovery UI, 486-lane authoring-model support, personalised/configured-list See All, rotation persistence, rich browse filters, smart Lists and the full catalogue index.
          files: |
            candidate/Moonfin_HomeLab_Seerr_Discovery_Web_0079647902b5.tar.gz
            candidate/Moonfin_HomeLab_Seerr_Discovery_Web_0079647902b5.tar.gz.sha256
            candidate/build/web/build-manifest.json
            candidate/build/web/homelab-build-manifest.json
            candidate/build/web/config.json
          fail_on_unmatched_files: true

      - name: Verify published prerelease and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,tagName,assets)"
          printf '%s' "$json" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg asset "$ASSET_NAME" \
            '.isPrerelease == true and
             .tagName == $tag and
             ([.assets[].name] | index($asset) != null) and
             ([.assets[].name] | index($asset + ".sha256") != null) and
             ([.assets[].name] | index("homelab-build-manifest.json") != null) and
             ([.assets[].name] | index("config.json") != null)' >/dev/null
          echo "published_release_tag=$RELEASE_TAG"
